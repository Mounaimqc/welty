  <!-- Preconnect Google Fonts for Instant Splash Rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    html, body {
      background-color: #160C08;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Luxury Splash Screen Container */
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at 50% 40%, #2B140D 0%, #1A0D08 55%, #140A06 100%);
      color: #D8B46A;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.65s cubic-bezier(0.4, 0, 0.2, 1), transform 0.65s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.65s;
      transform: scale(1);
      user-select: none;
    }

    #loading-container.fade-out {
      opacity: 0;
      transform: scale(1.03);
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 24px;
      max-width: 480px;
      animation: splashAppear 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes splashAppear {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Gold Emblem / Crest */
    .brand-crest {
      position: relative;
      width: 68px;
      height: 68px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(216, 180, 106, 0.12) 0%, rgba(22, 12, 8, 0) 70%);
      animation: pulseGlow 3s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 20px rgba(216, 180, 106, 0.2);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 35px rgba(216, 180, 106, 0.45);
        transform: scale(1.03);
      }
    }

    /* Brand Name */
    .brand-name-group {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .brand-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: 5px;
      margin: 0;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFF5DF 0%, #E2BE77 40%, #D8B46A 60%, #A67B2A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 14px rgba(216, 180, 106, 0.35));
      line-height: 1.1;
    }

    .brand-sub {
      font-family: 'Cairo', Arial, sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      letter-spacing: 1px;
      color: #D8B46A;
      margin: 0;
      line-height: 1.1;
      text-shadow: 0 2px 12px rgba(216, 180, 106, 0.3);
    }

    /* Delicate Gold Accent Line */
    .gold-line-accent {
      width: 44px;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, #D8B46A 50%, transparent 100%);
      margin: 14px auto 16px auto;
      border-radius: 1px;
    }

    /* Tagline */
    .brand-tagline {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1.05rem;
      font-weight: 500;
      color: #E2D6C8;
      letter-spacing: 0.8px;
      margin-bottom: 4px;
      opacity: 0.95;
    }

    .brand-tagline-ar {
      font-family: 'Cairo', Arial, sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #C7B8A8;
      margin-bottom: 28px;
      direction: rtl;
    }

    /* Luxury Sleek Progress Bar */
    .loader-track {
      width: 170px;
      height: 2px;
      background: rgba(216, 180, 106, 0.15);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
      margin-bottom: 22px;
    }

    .loader-shimmer {
      position: absolute;
      top: 0;
      left: -100%;
      height: 100%;
      width: 65%;
      background: linear-gradient(90deg, transparent 0%, rgba(255, 243, 214, 0.8) 50%, #D8B46A 100%);
      border-radius: 2px;
      animation: goldShimmer 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 10px rgba(216, 180, 106, 0.7);
    }

    @keyframes goldShimmer {
      0% {
        left: -65%;
      }
      100% {
        left: 100%;
      }
    }

    /* Origin & Craftsmanship Badge */
    .brand-badge {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2.2px;
      color: #8C7A6B;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .brand-title {
        font-size: 2.2rem;
        letter-spacing: 4px;
      }
      .brand-sub {
        font-size: 1.7rem;
      }
      .brand-tagline {
        font-size: 0.92rem;
      }
      .brand-tagline-ar {
        font-size: 0.85rem;
      }
      .brand-crest {
        width: 58px;
        height: 58px;
        margin-bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="splash-content">
      <!-- Luxury Gold Medallion with Cocoa Leaf motif -->
      <div class="brand-crest">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="24" cy="24" r="22" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 3"/>
          <circle cx="24" cy="24" r="18" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>
          <!-- Cocoa Leaf -->
          <path d="M24 9C24 9 33 16 33 26C33 31.5 28.5 37 24 39C19.5 37 15 31.5 15 26C15 16 24 9 24 9Z" fill="url(#goldGrad)" opacity="0.9"/>
          <!-- Leaf Veins -->
          <path d="M24 11V37M24 18L28.5 22.5M24 24L29.5 27.5M24 22L19.5 25.5M24 28L18.5 31.5" stroke="#160C08" stroke-width="1.3" stroke-linecap="round"/>
          <defs>
            <linearGradient id="goldGrad" x1="12" y1="9" x2="36" y2="39" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#FFF5DF"/>
              <stop offset="45%" stop-color="#E2BE77"/>
              <stop offset="70%" stop-color="#D8B46A"/>
              <stop offset="100%" stop-color="#9C7326"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- Bilingual Brand Identity -->
      <div class="brand-name-group">
        <h1 class="brand-title">WELTY</h1>
        <span class="brand-sub">ويلتي</span>
      </div>

      <div class="gold-line-accent"></div>

      <!-- Signature Tagline -->
      <div class="brand-tagline">Le plaisir du chocolat, signé WELTY</div>
      <div class="brand-tagline-ar">متعة الشوكولاطة، بتوقيع ويلتي</div>

      <!-- High-End Gold Shimmer Progress Track -->
      <div class="loader-track">
        <div class="loader-shimmer"></div>
      </div>

      <!-- Origin Badge -->
      <div class="brand-badge">CHOCOLATERIE D'EXCELLENCE • ALGÉRIE</div>
    </div>
  </div>

  <script>
    // Ensure fresh build by unregistering any stale service workers
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Robust smooth splash dismissal once Flutter renders its first frame
    (function() {
      var isDismissed = false;
      function dismissSplash() {
        if (isDismissed) return;
        isDismissed = true;
        var container = document.getElementById('loading-container');
        if (container) {
          container.classList.add('fade-out');
          setTimeout(function() {
            if (container && container.parentNode) {
              container.parentNode.removeChild(container);
            }
            document.body.style.overflow = '';
          }, 700);
        }
      }

      // 1. Observe when Flutter engine attaches the view to DOM
      var observer = new MutationObserver(function(mutations, obs) {
        var flutterElement = document.querySelector('flutter-view') || 
                             document.querySelector('flt-glass-pane') ||
                             document.querySelector('flt-scene-host');
        if (flutterElement) {
          obs.disconnect();
          // Give 800ms for first paint and branding appreciation
          setTimeout(dismissSplash, 800);
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // 2. Window load fallback (for Flutter Web initial bundle delivery)
      window.addEventListener('load', function() {
        setTimeout(function() {
          if (!isDismissed) {
            dismissSplash();
          }
        }, 3200);
      });

      // 3. Safety hard timeout so the splash screen never hangs
      setTimeout(dismissSplash, 9000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
